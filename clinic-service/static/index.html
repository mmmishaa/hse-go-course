<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поликлиника - Запись онлайн</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🏥 Электронная система записи в поликлинику</h1>
        
        <div id="auth-section">
            <h2>Регистрация</h2>
            <form id="register-form">
                <input type="text" id="reg-fname" placeholder="Имя" required>
                <input type="text" id="reg-lname" placeholder="Фамилия" required>
                <input type="tel" id="reg-phone" placeholder="Телефон (+7...)" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-pass" placeholder="Пароль" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <hr style="margin: 16px 0; border: 0; border-top: 1px solid #e5e7eb;">
            <h2>Вход</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-pass" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>
            <p id="auth-msg" class="message"></p>
        </div>
        
        <div id="app-section" style="display:none;">
            <div id="user-info" style="margin-bottom: 12px; font-size: 14px; color: #64748b;"></div>
            <h2>Запись на прием</h2>
            <form id="apt-form">
                <label>Выберите врача:</label>
                <select id="apt-doctor" required></select>
                
                <label>Дата приема:</label>
                <input type="date" id="apt-date" required>
                
                <label>Свободное время:</label>
                <select id="apt-time" required></select>
                
                <button type="submit">Записаться</button>
            </form>
            <p id="apt-msg" class="message"></p>
            
            <h3>Мои записи</h3>
            <button id="refresh-btn">🔄 Обновить список</button>
            <ul id="apt-list"></ul>
            
            <button id="logout-btn" class="secondary">Выйти</button>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
