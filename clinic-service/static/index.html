<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поликлиника - Запись онлайн</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Электронная система записи в поликлинику</h1>
        </header>
        
        <section id="auth-section">
            <div class="auth-block">
                <h2>Регистрация</h2>
                <form id="register-form">
                    <input type="text" id="reg-fname" placeholder="Имя" required>
                    <input type="text" id="reg-lname" placeholder="Фамилия" required>
                    <input type="tel" id="reg-phone" placeholder="Телефон" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-pass" placeholder="Пароль" required>
                    <button type="submit">Зарегистрироваться</button>
                </form>
            </div>
            <div class="auth-divider"></div>
            <div class="auth-block">
                <h2>Вход</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-pass" placeholder="Пароль" required>
                    <button type="submit">Войти</button>
                </form>
            </div>
            <p id="auth-msg" class="message"></p>
        </section>
        
        <section id="app-section" style="display:none;">
            <div id="user-info"></div>
            <h2>Запись на прием</h2>
            <form id="apt-form">
                <label for="apt-doctor">Врач</label>
                <select id="apt-doctor" required></select>
                
                <label for="apt-date">Дата приема</label>
                <input type="date" id="apt-date" required>
                
                <label for="apt-time">Свободное время</label>
                <select id="apt-time" required></select>
                
                <button type="submit">Записаться</button>
            </form>
            <p id="apt-msg" class="message"></p>
            
            <h3>Мои записи</h3>
            <button id="refresh-btn" class="secondary">Обновить список</button>
            <ul id="apt-list"></ul>
            
            <button id="logout-btn" class="danger">Выйти</button>
        </section>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
